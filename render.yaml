# Deploy to Render: New → Blueprint → point it at this repository.
#
# One service, not two. The container runs Next on the public port and Express
# behind it on loopback, so the browser sees a single origin — which is what the
# `__Host-` prefixed session cookies require. Split across two *.onrender.com
# hostnames they would be cross-site, and the login would silently not stick.
#
# Two values are deliberately not in this file, and Render will prompt for both
# when you apply the blueprint:
#
#   DATABASE_URL   a Neon connection string. Render's own free Postgres expires
#                  after 30 days, which is no use for a link meant to keep
#                  working. Use Neon's *direct* endpoint — the host must not
#                  contain `-pooler`; see the Deployment section of the README
#                  for why the migration lock needs it.
#
#   S3_*           any S3-compatible bucket. The free instance's disk is wiped
#                  on every deploy, so `STORAGE_DRIVER=local` here would mean
#                  every uploaded file disappearing on the next push.
#
# Free instances sleep after 15 minutes idle and take about a minute to wake.
# The URL itself is permanent; only the first request after a quiet spell pays.

services:
  - type: web
    name: basalt
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      # Render terminates TLS at its edge, so the client IP and protocol arrive
      # in X-Forwarded-*. Without this, rate limits would bucket every visitor
      # together under the proxy's address.
      - key: TRUST_PROXY
        value: 'true'

      # WEB_ORIGIN is intentionally absent: env.ts reads RENDER_EXTERNAL_URL,
      # so the CORS allowlist and the share links match the real hostname with
      # nothing to configure.

      - key: DATABASE_URL
        sync: false
      # A no-op when the URL carries `sslmode=require` (pg lets the connection
      # string win), and the thing that saves you when it does not.
      - key: DATABASE_SSL
        value: 'true'

      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_PEPPER
        generateValue: true

      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: 'true'
      # S3_ACL and S3_SSE are deliberately unset — R2, B2 and any bucket with
      # ACLs disabled reject both headers outright.
