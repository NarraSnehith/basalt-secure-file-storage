# One-click deploy to Render (https://render.com/deploy).
#
#   1. push this repository to GitHub
#   2. Render → New → Blueprint → point it at the repo
#   3. it creates the database and both services from this file
#
# The two secrets are generated by Render; nothing here needs a value from you.
#
# Note on the free tier: its disk is ephemeral, so uploaded blobs do not survive
# a redeploy. For anything real, set STORAGE_DRIVER=s3 with a bucket (any
# S3-compatible service works — R2, MinIO, Wasabi) and the bytes live there
# instead.

databases:
  - name: basalt-db
    databaseName: basalt
    user: basalt
    plan: free

services:
  - type: web
    name: basalt-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    dockerCommand: sh -c "node dist/db/migrate.js up && node dist/server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: '4000'
      - key: DATABASE_URL
        fromDatabase:
          name: basalt-db
          property: connectionString
      - key: DATABASE_SSL
        value: 'true'
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_PEPPER
        generateValue: true
      - key: TRUST_PROXY
        value: 'true'
      - key: STORAGE_DRIVER
        value: local
      # Set to the web service's URL after the first deploy, so CORS and the
      # links in share pages point at the right host.
      - key: WEB_ORIGIN
        sync: false

  - type: web
    name: basalt-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_ORIGIN
        fromService:
          name: basalt-api
          type: web
          property: hostport
