<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Basalt">
  <title>Basalt</title>
  <!--
    Columnar basalt: lava cools and cracks into hexagonal columns. Two tones so
    it reads as a solid column rather than a flat outline, and no strokes or fine
    detail, because the shape has to survive being drawn 16 pixels wide.
  -->
